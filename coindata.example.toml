# coindata 설정 예시. 여기 적힌 값은 모두 기본값이다(PRD 부록 A.10, FR-6.2).
# 사용하려면 coindata.toml로 복사한 뒤 바꿀 값만 남기면 된다. 빠진 키는 기본값을 쓴다.
# 상대 경로는 설정 파일이 있는 폴더를 기준으로 한다.
# 지표·레짐·레벨·이벤트 값은 관행적 기본값이며 검증되지 않았다(PRD 15.1).

[data]
symbol = "ETHUSDT"
db_path = "data/coindata.sqlite3"
init_days = 130                   # init 기본 기간(일). 1d 워밍업 119일 + 여유 (A.9.2)
archive_publish_delay_days = 2    # 이 기간이 지나도 아카이브가 없으면 archive_missing (12.2)
refill_window_days = 30           # sync가 빈칸을 다시 채우려 시도하는 최근 기간(일)

[runtime]
log_level = "WARNING"            # 요청마다 기록을 보려면 "INFO"
archive_base_url = "https://data.binance.vision/data"
rest_base_url = "https://fapi.binance.com"
http_timeout_seconds = 30.0
max_retries = 5                   # 네트워크 오류·5xx 재시도 횟수 (FR-1.6)
backoff_initial_seconds = 1.0
backoff_max_seconds = 60.0
rate_limit_ratio = 0.7            # 요청 한도의 이 비율에 도달하면 대기 (FR-1.5)
checksum_retries = 2              # 체크섬 불일치 시 재다운로드 횟수 (FR-1.1)
db_busy_timeout_ms = 5000

[indicators]
timeframes = ["15m", "30m", "1h", "1d"]

[indicators.atr]
n = 14

[indicators.parkinson]
n = 20
pct_lookback = 100

[indicators.candle]
report_bars = 5

[indicators.zigzag]
k = 2.0

[indicators.structure]
displacement_mult = 1.5
displacement_lookback = 20
equal_tol_atr = 0.1               # 스윙 차가 이 × ATR 미만이면 같음 (A.3.3)

[indicators.flow]
ema_n = 15                        # 체결 델타 EMA 기간 (A.12)
pct_lookback = 100

[regime.er]
n = 10
trend = 0.5
range = 0.3

[regime.vol]
high = 80.0
low = 20.0

[regime.shock]
timeframes = ["15m", "30m", "1h"]
wick_th = 0.6
range_atr_th = 1.5
gap_bars = 2
duration_bars = 4

[derivatives.quadrant]
periods = ["1h", "4h"]
band_lookback = 2016              # 불감대 분포 표본 수(5분 스냅샷, 7일) (A.5.1)
band_pct = 30.0
confirm_snapshots = 3             # 확정 상태로 인정하는 연속 스냅샷 수
min_coverage = 0.9

[derivatives.premium]
windows = ["15m", "1h", "4h"]
smoothing_tf = "15m"
pct_lookback = 672
current_pct_lookback = 10080      # 현재 1분 값 백분위 표본(7일) (A.5.2)
min_coverage = 0.9

[derivatives.ratios]
pct_lookback = 2016               # 비율 지표 백분위 표본(5분, 7일) (A.5.4)
min_coverage = 0.9

[levels]
swing_timeframes = ["15m", "1h"]
normalize_tf = "1h"
vwap_window_minutes = 1440
range_window_minutes = 1440
swing_count = 5
merge_dist = 0.5
zone_width = 0.25
report_each_side = 5
touch_tf = "15m"                  # 터치 횟수를 세는 TF (A.7.5)

[events]
report_bars = { "15m" = 16, "30m" = 8, "1h" = 8, "1d" = 3 }

[events.quadrant_change]
report_minutes = 240

[events.level]
timeframes = ["15m"]

[events.volume_spike]
timeframes = ["15m", "30m", "1h"]
lookback = 20
mult = 2.0

[events.premium_extreme]
high = 95.0
low = 5.0

[compute]
anchor_time = ""                  # 경로 의존 계산의 시작일 YYYY-MM-DD. 비우면 저장소 첫 1분봉 (A.1.8)

[report]
output_dir = "summaries"
swings_per_tf = 6
stale_minutes_bars = 3            # 실행 시각 대비 이만큼 늦으면 경고 (FR-4.3)
stale_minutes_metrics = 15
digits_price = 2
digits_ratio = 3
digits_bp = 2
digits_pct = 1
digits_volume = 3

[historical]
# 과거 시점 요약에서 공개 지연 가능성을 표시할 필드별 지연(분) (FR-4.8)
publication_lag_minutes = { sum_open_interest = 5, sum_open_interest_value = 5, top_position_ratio = 5, top_account_ratio = 5, global_account_ratio = 5, taker_buy_sell_ratio = 10 }

[plans]
default_ttl_hours = 24            # 계획 만료 기본값: 등록 기준 요약 시각 + 이 시간 (FR-7.1)
report_hours = 48                 # 요약에 싣는 최근 종료 계획의 범위 (FR-7.6)

[stats]
min_n = 30                         # 버킷 표본이 이보다 적으면 비율을 싣지 않는다 (부록 B)

[stats.s1]
horizon_bars = [4, 8]             # 돌파 유지 판정 기간(15m 봉). 바꾸면 정의 버전 변경 (부록 B.1.2)
