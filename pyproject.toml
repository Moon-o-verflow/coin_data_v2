[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coindata"
version = "3.0.0.dev0"
description = "바이낸스 USD-M ETHUSDT 판단 재료 생성기"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
coindata = "coindata.cli:main"

[tool.setuptools.packages.find]
include = ["coindata*"]
