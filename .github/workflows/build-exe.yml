# Windows 단일 실행 파일 빌드 (PRD FR-8.9).
# main에 push되거나 PR이 열리면, 또는 Actions 화면에서 직접 실행하면 coindata.exe를 만든다.
# 결과는 실행 화면의 Artifacts에서 coindata-windows로 내려받는다.
name: build-exe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 시험
        run: python -m unittest discover -s tests

      - name: 빌드 도구 설치
        run: python -m pip install pyinstaller tzdata

      - name: 실행 파일 만들기
        run: >-
          pyinstaller --onefile --windowed --name coindata
          --collect-data tzdata --paths .
          packaging/coindata_gui.py

      - name: 배포 폴더 구성
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item dist/coindata.exe dist/package/
          Copy-Item coindata.example.toml dist/package/
          Copy-Item packaging/README-exe.txt dist/package/

      - uses: actions/upload-artifact@v4
        with:
          name: coindata-windows
          path: dist/package/
          if-no-files-found: error
